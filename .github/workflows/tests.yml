name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: "8.83"
            php: "8.1"
            phpunit: "^9.6"
          - laravel: "9.52"
            php: "8.1"
            phpunit: "^10.5"
          - laravel: "10.0"
            php: "8.2"
            phpunit: "^10.5"
          - laravel: "11.0"
            php: "8.3"
            phpunit: "^11.5"
          - laravel: "12.0"
            php: "8.4"
            phpunit: "^12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require --no-interaction \
            "phpunit/phpunit:${{ matrix.phpunit }}" \
            --dev \
            --with-all-dependencies \
            --prefer-dist \
            --no-progress \
            --no-security-blocking

          composer require --no-interaction \
            "illuminate/support:^${{ matrix.laravel }}" \
            "illuminate/http:^${{ matrix.laravel }}" \
            "illuminate/mail:^${{ matrix.laravel }}" \
            --with-all-dependencies \
            --prefer-dist \
            --no-progress \
            --no-security-blocking

      - name: Rebuild autoload
        run: composer dump-autoload --optimize --no-interaction

      - name: Run tests
        run: ./vendor/bin/phpunit --configuration phpunit.xml
